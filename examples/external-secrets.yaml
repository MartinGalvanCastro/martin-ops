apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: example-backend
  namespace: default
spec:
  provider:
    # shortcut: ejemplo genérico, reemplazar por el backend real (1Password/Vault/AWS) al elegirlo
    vault:
      server: https://vault.example.com
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: example-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: example-backend
    kind: SecretStore
  target:
    name: example-secret
  data:
    - secretKey: password
      remoteRef:
        key: myapp/password
