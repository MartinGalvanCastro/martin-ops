name: build-push

on:
  push:
    branches: [main]
    paths: ["apps/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push apps with Dockerfile
        run: |
          for df in apps/*/Dockerfile; do
            [ -f "$df" ] || continue
            app=$(dirname "$df" | cut -d/ -f2)
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$app"
            docker build -t "$image:latest" -t "$image:${GITHUB_SHA::12}" "$(dirname "$df")"
            docker push "$image:latest"
            docker push "$image:${GITHUB_SHA::12}"
          done
