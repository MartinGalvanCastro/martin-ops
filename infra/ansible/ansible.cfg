[defaults]
inventory = inventory/hosts.ini
interpreter_python = auto_silent
roles_path = roles
private_key_file = ~/.ssh/martin-ops

[ssh_connection]
# accept-new: acepta la llave del host la primera vez y rechaza si cambia (no desactiva la verificación).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
