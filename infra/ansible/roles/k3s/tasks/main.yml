---
- name: Flush Oracle default iptables INPUT rules (bloquean tráfico de k3s)
  ansible.builtin.command: /usr/sbin/iptables -F INPUT
  changed_when: true

- name: Persist iptables vacío
  ansible.builtin.command: /usr/sbin/netfilter-persistent save
  changed_when: true

- name: Instalar k3s sin traefik
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable=traefik --write-kubeconfig-mode 644" sh -
  args:
    creates: /usr/local/bin/k3s

- name: Esperar node ready
  ansible.builtin.command: k3s kubectl get --raw /readyz
  register: readyz
  until: readyz.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Fetch kubeconfig
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kube/kubeconfig"
    flat: true

- name: Apuntar kubeconfig a la IP pública
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../kube/kubeconfig"
    regexp: '127\.0\.0\.1'
    replace: "{{ hostvars[inventory_hostname].ansible_host }}"
  delegate_to: localhost
  become: false
