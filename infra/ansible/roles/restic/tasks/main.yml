---
- name: Instalar restic
  ansible.builtin.apt:
    name: restic
    state: present
    update_cache: true
  when: restic_repo | length > 0

- name: Directorio de configuración restic
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"
  when: restic_repo | length > 0

- name: Password file restic
  ansible.builtin.copy:
    content: "{{ restic_password }}"
    dest: "{{ restic_password_file }}"
    mode: "0600"
  no_log: true
  when: restic_repo | length > 0

- name: Script de backup
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /etc/restic/backup.sh
    mode: "0700"
  when: restic_repo | length > 0

- name: Servicio systemd de backup
  ansible.builtin.copy:
    src: restic-backup.service
    dest: /etc/systemd/system/restic-backup.service
    mode: "0644"
  notify: daemon-reload
  when: restic_repo | length > 0

- name: Timer diario de backup
  ansible.builtin.copy:
    src: restic-backup.timer
    dest: /etc/systemd/system/restic-backup.timer
    mode: "0644"
  notify: daemon-reload
  when: restic_repo | length > 0

- name: Activar timer
  ansible.builtin.systemd_service:
    name: restic-backup.timer
    enabled: true
    state: started
  when: restic_repo | length > 0
