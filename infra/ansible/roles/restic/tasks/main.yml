---
- name: Backup restic del nodo
  when: restic_repo | length > 0
  block:
    - name: Exigir password de restic
      ansible.builtin.assert:
        that: restic_password | length > 0
        fail_msg: "Define restic_password: cifra el repo y sin él no se pueden restaurar los backups."

    - name: Instalar restic y sqlite3
      ansible.builtin.apt:
        name:
          - restic
          - sqlite3
        state: present
        update_cache: true

    - name: Directorio de configuración restic
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        mode: "0700"

    - name: Password file restic
      ansible.builtin.copy:
        content: "{{ restic_password }}"
        dest: "{{ restic_password_file }}"
        mode: "0600"
      no_log: true

    - name: Entorno de restic (repo + credenciales del backend)
      ansible.builtin.template:
        src: env.j2
        dest: /etc/restic/env
        mode: "0600"
      no_log: true

    - name: Ver si el repo restic existe
      ansible.builtin.shell: set -a && . /etc/restic/env && restic cat config
      register: restic_repo_check
      changed_when: false
      failed_when: false

    - name: Inicializar repo restic
      ansible.builtin.shell: set -a && . /etc/restic/env && restic init
      when: restic_repo_check.rc != 0
      changed_when: true

    - name: Script de backup
      ansible.builtin.template:
        src: backup.sh.j2
        dest: /etc/restic/backup.sh
        mode: "0700"

    - name: Servicio systemd de backup
      ansible.builtin.copy:
        src: restic-backup.service
        dest: /etc/systemd/system/restic-backup.service
        mode: "0644"
      notify: Recargar systemd

    - name: Timer diario de backup
      ansible.builtin.copy:
        src: restic-backup.timer
        dest: /etc/systemd/system/restic-backup.timer
        mode: "0644"
      notify: Recargar systemd

    # daemon_reload aquí: el handler corre al final del play, tarde para un timer recién copiado.
    - name: Activar timer
      ansible.builtin.systemd_service:
        name: restic-backup.timer
        enabled: true
        state: started
        daemon_reload: true
