apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# configs/ NO va aquí: lo aplica la Kustomization infrastructure-configs cuando ya existen las CRDs.
resources:
  - namespaces.yaml
  - sources
  - cert-manager
  - traefik
  - keda
  - monitoring
  - velero
# Todos los HelmRelease: reintentar install/upgrade fallidos (rollback) y actualizar CRDs
# (por defecto Flux no toca las CRDs en upgrades).
patches:
  - target:
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: all
      spec:
        install:
          crds: CreateReplace
          remediation:
            retries: 3
        upgrade:
          crds: CreateReplace
          cleanupOnFail: true
          remediation:
            retries: 3
