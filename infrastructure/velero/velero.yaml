apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 1h
  chart:
    spec:
      chart: velero
      version: "12.2.3"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
  values:
    # provider aws = API S3-compatible de OCI; la versión del plugin sigue a Velero (1.18 -> v1.14).
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        volumeMounts:
          - mountPath: /target
            name: plugins
    # Sin VolumeSnapshotLocation: los volúmenes se respaldan con fs-backup del node-agent (opt-in por pod).
    snapshotsEnabled: false
    deployNodeAgent: true
    credentials:
      existingSecret: velero-oci
    configuration:
      backupStorageLocation:
        - name: oci
          provider: aws
          default: true
          bucket: martin-ops-velero # Terraform: oci_objectstorage_bucket.backup
          credential:
            name: velero-oci
            key: cloud
          config:
            region: us-chicago-1
            s3Url: https://axvmef9kdxvh.compat.objectstorage.us-chicago-1.oraclecloud.com
            s3ForcePathStyle: "true"
            # OCI rechaza los checksums por defecto del SDK v2 de AWS.
            checksumAlgorithm: ""
    schedules:
      daily:
        schedule: "0 3 * * *"
        template:
          ttl: 168h0m0s
