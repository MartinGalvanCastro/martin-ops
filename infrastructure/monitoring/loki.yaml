apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.5.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    loki:
      # Un solo tenant: sin esto Alloy necesita header X-Scope-OrgID.
      auth_enabled: false
      limits_config:
        retention_period: 168h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 20Gi
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
    # memcached del chart pide ~8 GB por defecto; innecesario en un nodo.
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    lokiCanary:
      enabled: false
    test:
      enabled: false
    gateway:
      enabled: false
